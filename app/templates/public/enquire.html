{% extends 'base.html' %}{% block title %}Enquire — FARM360{% endblock %}{% block content %}<section class="page-hero"><div class="container py-5"><p class="eyebrow">START A CONVERSATION</p><h1>Tell us what you have in mind.</h1><p class="lead">A few details will help us understand your project.</p></div></section><section class="container section-pad"><div class="form-panel"><form method="post" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="honeypot" aria-hidden="true"><label for="website">Leave this field empty</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div><div class="row g-3"><div class="col-md-6"><label class="form-label" for="full_name">Full name <span aria-hidden="true">*</span></label><input class="form-control" id="full_name" name="full_name" maxlength="160" required value="{{ request.form.get('full_name','') }}"></div><div class="col-md-6"><label class="form-label" for="phone">Phone number <span aria-hidden="true">*</span></label><input class="form-control" id="phone" name="phone" type="tel" required value="{{ request.form.get('phone','') }}"></div><div class="col-md-6"><label class="form-label" for="email">Email (optional)</label><input class="form-control" id="email" name="email" type="email" value="{{ request.form.get('email','') }}"></div><div class="col-md-6"><label class="form-label" for="location">Location <span aria-hidden="true">*</span></label><input class="form-control" id="location" name="location" required value="{{ request.form.get('location','') }}"></div><div class="col-12"><label class="form-label" for="service_id">Service <span aria-hidden="true">*</span></label><select class="form-select" id="service_id" name="service_id" required><option value="">Choose a service</option>{% for s in services %}<option value="{{ s.id }}" {% if request.form.get('service_id') == s.id|string or request.args.get('service') == s.id|string %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label" for="description">What would you like help with?</label><textarea class="form-control" id="description" name="description" rows="5" maxlength="5000">{{ request.form.get('description','') }}</textarea></div><div class="col-12"><button class="btn btn-success btn-lg rounded-pill px-4" type="submit">Send enquiry</button><span class="text-muted small ms-3">Fields marked * are required.</span></div></div></form></div></section>{% endblock %}
